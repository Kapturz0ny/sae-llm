model:
  max_seq_length: 1024
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

peft:
  use_peft: true
  lora_r: 32
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  use_rslora: true

trainer:
  trainer_args:
    num_train_epochs: 3
    learning_rate: 2.0e-5
    warmup_ratio: 0.05
    lr_scheduler_type: "cosine"
    optim: "adamw_8bit"
    adam_beta1: 0.9
    adam_beta2: 0.999
    max_grad_norm: 1.0 
    bf16: true
    logging_steps: 10
    save_strategy: "epoch"
    report_to: "wandb"
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false